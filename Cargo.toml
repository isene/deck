[package]
name = "deck"
version = "0.1.30"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "A paned terminal front for Claude Code: the answer in its own pane, each tool call one line beside it, the status line at the bottom. Part of the Fe2O3 Rust terminal suite."
license = "Unlicense"
repository = "https://github.com/isene/deck"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
